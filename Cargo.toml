[workspace]
# host/src-tauri ditambahkan setelah scaffold Tauri
members = [
    "crates/tab-deck",
    "crates/tab-host",
    "crates/tab-input",
    "crates/tab-media",
    "crates/tab-metrics",
    "crates/tab-probe",
    "crates/tab-protocol",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
tab-deck = { path = "crates/tab-deck" }
tab-host = { path = "crates/tab-host" }
tab-input = { path = "crates/tab-input" }
tab-media = { path = "crates/tab-media" }
tab-metrics = { path = "crates/tab-metrics" }
tab-protocol = { path = "crates/tab-protocol" }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
ciborium = "0.2"
snow = "0.9"
rand = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
thiserror = "2"
tracing = "0.1"
blake2 = "0.10"
strum = { version = "0.27", features = ["derive"] }
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk", "network"] }
windows-sys = "0.61"
